<!DOCTYPE html>
<html lang="vi">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Cập nhật thông tin tài khoản</title>

    <link rel="stylesheet" href="update-profile.css">
</head>

<body>

    <main class="update-page">

        <div class="update-card">

            <div class="update-header">
                <h1>Cập nhật thông tin</h1>
                <p>Vui lòng điền đầy đủ thông tin sinh viên của bạn</p>
            </div>

            <form id="updateProfileForm">

                <!-- HỌ VÀ TÊN -->
                <div class="form-group full-width">
                    <label for="fullName">
                        Họ và tên <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="fullName"
                        placeholder="Nhập họ và tên"
                        required
                    >
                </div>


                <!-- NGÀY SINH -->
                <div class="form-group">
                    <label for="birthDate">
                        Ngày sinh <span>*</span>
                    </label>

                    <input
                        type="date"
                        id="birthDate"
                        required
                    >
                </div>


                <!-- MSSV -->
                <div class="form-group">
                    <label for="studentId">
                        Mã số sinh viên <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="studentId"
                        placeholder="Nhập MSSV"
                        required
                    >
                </div>


                <!-- EMAIL -->
                <div class="form-group full-width">
                    <label for="email">
                        Email <span>*</span>
                    </label>

                    <input
                        type="email"
                        id="email"
                        placeholder="example@gmail.com"
                        required
                    >
                </div>


                <!-- LỚP -->
                <div class="form-group">
                    <label for="studentClass">
                        Lớp <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="studentClass"
                        placeholder="Ví dụ: 70CNDPT2"
                        required
                    >
                </div>


                <!-- KHOA -->
                <div class="form-group">
                    <label for="faculty">
                        Khoa <span>*</span>
                    </label>

                    <input
                        type="text"
                        id="faculty"
                        placeholder="Ví dụ: Công nghệ thông tin"
                        required
                    >
                </div>


                <!-- ĐỊA CHỈ -->
                <div class="form-group full-width">
                    <label for="address">
                        Địa chỉ <span>*</span>
                    </label>

                    <textarea
                        id="address"
                        rows="3"
                        placeholder="Nhập địa chỉ hiện tại"
                        required
                    ></textarea>
                </div>




                <!-- GIỚI THIỆU - KHÔNG BẮT BUỘC -->
                <div class="form-group full-width">
                    <label for="introduction">
                        Giới thiệu <span class="optional-text">(không bắt buộc)</span>
                    </label>

                    <textarea
                        id="introduction"
                        rows="4"
                        maxlength="500"
                        placeholder="Viết một vài dòng giới thiệu về bản thân..."
                    ></textarea>
                </div>

                <!-- MỤC TIÊU CÁ NHÂN -->
                <div class="personal-goals full-width">
                    <div class="goals-heading">
                        <h2>Mục tiêu cá nhân</h2>
                        <p>Nhập mức kỳ vọng từ 0 đến 100 cho từng nhóm huy hiệu (không bắt buộc).</p>
                    </div>

                    <div class="goals-grid">
                        <div class="form-group">
                            <label for="goalTraining">Rèn luyện</label>
                            <input type="number" id="goalTraining" min="0" max="100" placeholder="0 - 100">
                        </div>

                        <div class="form-group">
                            <label for="goalAcademic">Học thuật</label>
                            <input type="number" id="goalAcademic" min="0" max="100" placeholder="0 - 100">
                        </div>

                        <div class="form-group">
                            <label for="goalSport">Thể thao</label>
                            <input type="number" id="goalSport" min="0" max="100" placeholder="0 - 100">
                        </div>

                        <div class="form-group">
                            <label for="goalSkill">Kỹ năng</label>
                            <input type="number" id="goalSkill" min="0" max="100" placeholder="0 - 100">
                        </div>

                        <div class="form-group">
                            <label for="goalVolunteer">Tình nguyện</label>
                            <input type="number" id="goalVolunteer" min="0" max="100" placeholder="0 - 100">
                        </div>

                        <div class="form-group">
                            <label for="goalArt">Nghệ thuật</label>
                            <input type="number" id="goalArt" min="0" max="100" placeholder="0 - 100">
                        </div>
                    </div>
                </div>

                <div class="form-actions">

                    <a href="profile.html" class="cancel-btn">
                        Hủy
                    </a>

                    <button type="submit" class="save-btn">
                        Lưu thông tin
                    </button>

                </div>

            </form>

        </div>

    </main>

<!-- POPUP CẬP NHẬT THÀNH CÔNG -->
<div class="login-popup" id="successPopup">

    <div class="login-popup-box">

        <p>Cập nhật thông tin thành công!</p>

        <button type="button" id="closeSuccessPopup">
            OK
        </button>

    </div>

</div>


    <script src="update-profile.js"></script>
</body>

</html>
